version: "3.8"

services:
  backend:
    image: harvey-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend:ro

  frontend:
    image: harvey-frontend:latest
    build:
      context: .
      dockerfile: frontend/app/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
